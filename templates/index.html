<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speczvyzochok PWA - Звонки</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1e1e1e; border-bottom: 1px solid #333; }
    .btn-call { background: #2e7d32; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .chat-container { flex: 1; padding: 20px; overflow-y: auto; }

    /* ЭКРАН ГРУППОВОГО ЗВОНКА */
    #call-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 999; display: flex; flex-direction: column; }
    #call-screen.hidden { display: none; }

    /* СЕТКА С ВИДЕО УЧАСТНИКОВ */
    .video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; }
    .video-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid #333; min-height: 200px; display: flex; align-items: center; justify-content: center; }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    .video-card .user-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 6px; font-size: 12px; }

    /* КНОПКИ УПРАВЛЕНИЯ ЗВОНКОМ */
    .call-controls { display: flex; justify-content: center; gap: 15px; padding: 20px; background: #1e1e1e; border-top: 1px solid #333; }
    .ctrl-btn { padding: 12px 20px; border-radius: 10px; border: none; background: #333; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }
    .ctrl-btn.off { background: #d32f2f; }
    .btn-danger { background: #c62828; }
  </style>
</head>
<body>

  <header>
    <h2>Спецзвязочок</h2>
    <button class="btn-call" onclick="startGroupCall()">📞 Начать звонок</button>
  </header>

  <div class="chat-container">
    <p style="color: #aaa;">Нажмите «Начать звонок», чтобы открыть окно группового WebRTC-звонка.</p>
  </div>

  <!-- Окно группового звонка -->
  <div id="call-screen" class="hidden">
    <div id="video-grid" class="video-grid">
      <div class="video-card" id="local-user-card">
        <video id="local-video" autoplay muted playsinline></video>
        <span class="user-label">Вы</span>
      </div>
    </div>

    <div class="call-controls">
      <button id="btn-mic" class="ctrl-btn" onclick="toggleMic()">🎤 Микрофон: Вкл</button>
      <button id="btn-cam" class="ctrl-btn" onclick="toggleCam()">📷 Камера: Вкл</button>
      <button class="ctrl-btn btn-danger" onclick="leaveCall()">📞 Завершить</button>
    </div>
  </div>

  <script>
    const socket = io();
    const roomId = 'general-room';
    let localStream = null;
    let isMicOn = true;
    let isCamOn = true;
    const peerConnections = {};

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    // 1. Старт звонка и получение потока камеры/микрофона
    async function startGroupCall() {
      document.getElementById('call-screen').classList.remove('hidden');
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
        socket.emit('join_call', { roomId: roomId });
      } catch (err) {
        alert("Разрешите доступ к камере и микрофону в браузере!");
        leaveCall();
      }
    }

    // 2. Выключение / Включение микрофона
    function toggleMic() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        isMicOn = !isMicOn;
        audioTrack.enabled = isMicOn;
        const btn = document.getElementById('btn-mic');
        btn.innerText = isMicOn ? '🎤 Микрофон: Вкл' : '🔇 Микрофон: Выкл';
        btn.classList.toggle('off', !isMicOn);
      }
    }

    // 3. Выключение / Включение камеры
    function toggleCam() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        isCamOn = !isCamOn;
        videoTrack.enabled = isCamOn;
        const btn = document.getElementById('btn-cam');
        btn.innerText = isCamOn ? '📷 Камера: Вкл' : '🚫 Камера: Выкл';
        btn.classList.toggle('off', !isCamOn);
      }
    }

    // 4. Завершение звонка
    function leaveCall() {
      socket.emit('leave_call', { roomId: roomId });
      
      Object.keys(peerConnections).forEach(sid => {
        peerConnections[sid].close();
        delete peerConnections[sid];
      });

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      const grid = document.getElementById('video-grid');
      grid.querySelectorAll('.video-card:not(#local-user-card)').forEach(card => card.remove());
      document.getElementById('call-screen').classList.add('hidden');
    }

    // --- WebRTC Сигналинг (Подключение других участников) ---

    socket.on('current_room_users', async ({ users }) => {
      for (const sid of users) {
        const pc = createPeer(sid);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('signal_to_peer', { targetSid: sid, signal: { sdp: pc.localDescription } });
      }
    });

    socket.on('user_joined_call', ({ sid }) => {
      const pc = createPeer(sid);
      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }
    });

    socket.on('signal_from_peer', async ({ senderSid, signal }) => {
      let pc = peerConnections[senderSid];
      if (!pc) {
        pc = createPeer(senderSid);
        if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      if (signal.sdp) {
        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
        if (signal.sdp.type === 'offer') {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit('signal_to_peer', { targetSid: senderSid, signal: { sdp: pc.localDescription } });
        }
      } else if (signal.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
      }
    });

    function createPeer(sid) {
      if (peerConnections[sid]) return peerConnections[sid];
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[sid] = pc;

      pc.onicecandidate = (e) => {
        if (e.candidate) socket.emit('signal_to_peer', { targetSid: sid, signal: { candidate: e.candidate } });
      };

      pc.ontrack = (e) => addRemoteStream(sid, e.streams[0]);
      return pc;
    }

    function addRemoteStream(sid, stream) {
      let card = document.getElementById(`user-card-${sid}`);
      if (!card) {
        card = document.createElement('div');
        card.id = `user-card-${sid}`;
        card.className = 'video-card';

        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;

        const label = document.createElement('span');
        label.className = 'user-label';
        label.innerText = `Участник #${sid.slice(0, 4)}`;

        card.appendChild(video);
        card.appendChild(label);
        document.getElementById('video-grid').appendChild(card);
      }
      card.querySelector('video').srcObject = stream;
    }

    socket.on('user_left_call', ({ sid }) => {
      if (peerConnections[sid]) {
        peerConnections[sid].close();
        delete peerConnections[sid];
      }
      const card = document.getElementById(`user-card-${sid}`);
      if (card) card.remove();
    });
  </script>
</body>
</html>
